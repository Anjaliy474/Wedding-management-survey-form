<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<!-- Behind the Shaadi: wedding-planning survey. Answers are saved to Supabase. Results: dashboard.html -->
<title>Behind the Shaadi</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="A 4-minute survey about planning a wedding in India.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Kalam:wght@400;700&family=Mukta:wght@400;500;600;700&display=swap">
<style>
/* Layout: one screen. Soft pastel backdrop that changes per chapter, a drawing on top that reacts
   to each answer, and a white question card below. Centred column, max 480px. */
:root{
  --ink:#2D2433;        /* text, outlines */
  --muted:#6C6274;
  --paper:#FFFFFF;      /* cards */
  --sun:#FFD95A;        /* selected answers */
  --coral:#FF7A59;      /* progress, accents */
  --coral-dk:#C24A2C;   /* coral text on white */
  --mint:#9BE0C1;
  --lilac:#CDBDF5;
  --hint:#F3EEE8;
  --f-display:"Baloo 2","Trebuchet MS",system-ui,sans-serif;
  --f-body:"Mukta","Segoe UI",system-ui,sans-serif;
  --f-hand:"Kalam","Segoe Print","Comic Sans MS",cursive;
  color-scheme:light;
}
[hidden]{display:none!important}
html{height:100%;box-sizing:border-box;background:#FFF6EE;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
body{height:100%;margin:0;background:#FFF6EE;color:var(--ink);font-family:var(--f-body);overflow:hidden;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--coral);outline-offset:2px}

/* ---------- backdrop ---------- */
.bgs{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.bg{position:absolute;inset:0;opacity:0;transition:opacity 1.1s ease}
.bg.on{opacity:1}
.blob{position:absolute;border-radius:50%;width:70vmax;height:70vmax;animation:drift 18s ease-in-out infinite alternate}
.blob.b1{left:-30vmax;top:-30vmax}
.blob.b2{right:-34vmax;top:18vh;animation-duration:22s;animation-delay:-6s}
.blob.b3{left:-20vmax;bottom:-40vmax;animation-duration:26s;animation-delay:-12s}
.fall{position:absolute;inset:0;opacity:0;transition:opacity 1s}
.fall.on{opacity:1}
.fall i{position:absolute;top:-14px;width:8px;height:12px;border-radius:2px;animation:fall linear infinite}

/* ---------- frame ---------- */
.app{position:relative;z-index:2;height:100%;max-width:480px;margin:0 auto;display:flex;flex-direction:column;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px}
.top{flex:0 0 auto;display:flex;flex-direction:column;gap:8px;transition:opacity .4s}
.app[data-mode="start"] .top,.app[data-mode="end"] .top{display:none}
.toprow{display:flex;justify-content:space-between;align-items:baseline;gap:12px;font:700 13.5px/1.2 var(--f-body)}
.pc{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pc b{color:var(--coral-dk)}
.pt{flex:0 0 auto;color:var(--muted);font-weight:600}
.segs{display:grid;grid-template-columns:repeat(6,1fr);gap:5px}
.segs i{height:7px;border-radius:99px;background:rgba(45,36,51,.1);overflow:hidden}
.segs b{display:block;height:100%;width:0;border-radius:inherit;background:var(--coral);transition:width .6s cubic-bezier(.2,.8,.2,1)}

.scene{position:relative;flex:1 1 auto;min-height:100px}
.art-wrap{position:absolute;inset:0}
.art-wrap.in{animation:artin .6s ease both}
.art-wrap.out{animation:artout .35s ease forwards}
.art{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.art .tb{font-family:var(--f-display);font-weight:800}
.art .tk{font-family:var(--f-hand);font-weight:700}
.art .tm{font-family:var(--f-body);font-weight:600}

/* ---------- card ---------- */
.card{position:relative;flex:0 0 auto;max-height:min(76%,640px);overflow:auto;overscroll-behavior:contain;margin-top:8px;
  background:var(--paper);border:1.5px solid var(--ink);border-radius:24px;padding:16px 16px 12px;
  box-shadow:0 14px 34px rgba(45,36,51,.12);scrollbar-width:thin}
.cin{animation:cin .42s cubic-bezier(.2,.9,.3,1.1) both}
.cin.from-top{animation-name:cintop}
.cin.out{animation:cout .15s ease forwards}
.kicker{margin:0 0 3px;font:600 14.5px/1.3 var(--f-body);color:var(--coral-dk)}
.q{margin:0 0 12px;font:800 21px/1.18 var(--f-display);text-wrap:balance}
.q:focus,.title:focus{outline:none}
.sub{margin:-7px 0 10px;font:500 13.5px/1.3 var(--f-body);color:var(--muted)}

.answers{display:grid;gap:10px}
.answers.grid{grid-template-columns:1fr 1fr}
.answers.grid>.opt:last-child:nth-child(odd){grid-column:1/-1}
.opt{appearance:none;display:flex;align-items:center;gap:10px;width:100%;min-height:48px;text-align:left;font:600 15.5px/1.25 var(--f-body);
  color:var(--ink);background:#fff;border:1.5px solid var(--ink);border-radius:14px;padding:9px 12px;box-shadow:0 3px 0 rgba(45,36,51,.16);
  cursor:pointer;transition:background .2s,transform .1s,box-shadow .1s}
.opt:hover{background:#FFFAEB}
.opt:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(45,36,51,.16)}
.opt.sel,.chip.sel{background:var(--sun);animation:sel .35s ease}
.mark{flex:0 0 auto;width:20px;height:20px;border:1.5px solid var(--ink);border-radius:50%;background:#fff;display:grid;place-items:center}
.opt.multi .mark{border-radius:6px}
.opt.sel .mark{background:var(--ink)}
.opt.sel .mark::after{content:"";width:7px;height:7px;border-radius:50%;background:var(--sun)}
.opt.multi.sel .mark::after{width:5px;height:9px;border-radius:0;background:none;border:solid var(--sun);border-width:0 2.5px 2.5px 0;transform:translate(0,-1px) rotate(45deg)}
.chips,.answers.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{appearance:none;font:600 14.5px/1.25 var(--f-body);color:var(--ink);background:#fff;border:1.5px solid var(--ink);border-radius:999px;
  padding:8px 14px 7px;text-align:left;cursor:pointer;box-shadow:0 2px 0 rgba(45,36,51,.14);transition:background .2s,transform .1s}
.chip:hover{background:#FFFAEB}
.chip:active{transform:translateY(1px)}
.opt.sel:hover,.chip.sel:hover{background:var(--sun)}
.chip.multi.sel::before{content:"✓";margin-right:6px;font-weight:800}
.answers.parts{display:flex;flex-direction:column;gap:0}
.part{padding:12px 0;border-top:1.5px dashed #E4DCD3}
.part:first-child{border-top:none;padding-top:0}
.plabel{margin:0 0 9px;font:700 15px/1.3 var(--f-body)}
.plabel small{font-weight:500;color:var(--muted)}
.plabel .tick{display:inline-grid;place-items:center;width:18px;height:18px;margin-left:6px;border-radius:50%;background:var(--mint);font-size:11px;vertical-align:1px;opacity:0;transform:scale(.3);transition:.3s cubic-bezier(.2,1.6,.4,1)}
.part.done .tick{opacity:1;transform:none}
.field{display:block;width:100%;font:500 16px/1.4 var(--f-body);color:var(--ink);background:#fff;border:1.5px solid var(--ink);border-radius:14px;padding:11px 14px;outline:none;transition:box-shadow .2s}
.field:focus{box-shadow:0 0 0 4px rgba(255,122,89,.25)}
.field::placeholder{color:#A39AA8}
textarea.field{min-height:116px;resize:vertical}
.field.other{margin-top:10px}
.flabel{display:block;margin:12px 0 6px;font:600 14px var(--f-body)}
.reveal{animation:cin .4s ease both}
.nslide{display:flex;flex-direction:column;align-items:center;padding:4px 2px 0}
.n-big{display:flex;align-items:baseline;gap:8px;margin-bottom:8px}
.n-big b{font:800 40px/1 var(--f-display);color:var(--coral-dk);font-variant-numeric:tabular-nums}
.n-big b.bump{animation:sel .3s ease}
.n-big span{font:600 14px var(--f-body);color:var(--muted)}
.nslide input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:12px;border-radius:99px;border:1.5px solid var(--ink);background:linear-gradient(90deg,var(--coral) 0 var(--p,50%),var(--hint) var(--p,50%));outline:none;cursor:pointer;touch-action:pan-y}
.nslide:not(.has) input[type=range]{background:var(--hint)}
.nslide input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:30px;height:30px;border-radius:50%;background:var(--sun);border:2px solid var(--ink);box-shadow:0 3px 0 rgba(45,36,51,.2)}
.nslide input[type=range]::-moz-range-thumb{width:28px;height:28px;border-radius:50%;background:var(--sun);border:2px solid var(--ink)}
.nslide input[type=range]:focus-visible{box-shadow:0 0 0 4px rgba(255,122,89,.3)}
.n-ends{display:flex;justify-content:space-between;width:100%;margin-top:6px;font:600 12px var(--f-body);color:var(--muted)}

/* drag meter */
.meter{display:flex;flex-direction:column;align-items:center}
.m-pic{width:84px;height:84px}
.m-pic svg{width:100%;height:100%;overflow:visible}
.m-word{margin:2px 0 6px;min-height:1.4em;font:800 17px/1.3 var(--f-display);color:var(--coral-dk)}
.m-track{position:relative;width:100%;padding:14px 0 2px;touch-action:pan-y;cursor:pointer;outline:none;border-radius:12px}
.m-track:focus-visible{box-shadow:0 0 0 3px rgba(255,122,89,.35)}
.m-rail{position:absolute;left:10%;right:10%;top:20px;height:10px;border-radius:99px;background:var(--hint);border:1.5px solid var(--ink)}
.m-fill{display:block;height:100%;width:0;border-radius:inherit;background:var(--coral);transition:width .25s}
.meter.dragging .m-fill{transition:none}
.m-thumb{position:absolute;top:11px;left:50%;width:28px;height:28px;margin-left:-14px;border-radius:50%;background:#fff;border:2px solid var(--ink);
  box-shadow:0 3px 0 rgba(45,36,51,.2);transition:left .25s cubic-bezier(.2,1.3,.4,1),transform .2s;opacity:.45}
.meter.has .m-thumb{opacity:1;background:var(--sun)}
.meter.dragging .m-thumb{transition:transform .2s;transform:scale(1.18)}
.m-stops{position:relative;display:grid;grid-template-columns:repeat(5,1fr);margin-top:24px}
.m-stop{display:flex;flex-direction:column;align-items:center;gap:3px;font:600 11.5px/1.15 var(--f-body);color:var(--muted);text-align:center}
.m-stop i{width:6px;height:6px;border-radius:50%;background:#CFC6D6}
.m-stop.on{color:var(--ink)}
.m-stop.on i{background:var(--ink)}
.bigchilli .c-g{transform-box:fill-box;transform-origin:50% 50%;transition:transform .3s cubic-bezier(.2,1.4,.4,1)}
.bigchilli .c-body{transition:fill .3s}
.bigchilli .c-steam{transition:opacity .3s}
.bigchilli.hot .c-g{animation:jit .18s linear infinite}
.face .f-cheek,.face .f-tear{transition:opacity .3s}

/* quick-round deck */
.deck{position:relative;height:104px;margin:2px 4px 14px}
.dk{position:absolute;left:0;right:0;top:0;height:96px;border:1.5px solid var(--ink);border-radius:18px;background:#fff;transition:opacity .3s}
.dk.d2{transform:translateY(6px) scale(.96);background:#FFF1E8}
.dk.d3{transform:translateY(12px) scale(.92);background:#FFE6D8}
.dk.d1{z-index:2;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:8px 16px;text-align:center;box-shadow:0 6px 16px rgba(45,36,51,.1)}
.dnum{font:700 11.5px var(--f-body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.ditem{margin:4px 0 0;font:800 18px/1.2 var(--f-display);text-wrap:balance}
.d1.fly-l{animation:flyl .38s ease-in forwards}
.d1.fly-r{animation:flyr .38s ease-in forwards}
.d1.fly-u{animation:flyu .38s ease-in forwards}
.d1.deal{animation:deal .35s cubic-bezier(.2,1.2,.4,1)}
.scale{display:grid;grid-template-columns:repeat(5,1fr);gap:7px}
.pip{display:flex;flex-direction:column;align-items:center;gap:3px;min-width:0;min-height:78px;background:#fff;border:1.5px solid var(--ink);border-radius:14px;
  padding:7px 2px 6px;cursor:pointer;box-shadow:0 3px 0 rgba(45,36,51,.16);transition:background .2s,transform .1s}
.pip:active{transform:translateY(2px)}
.pip.lit{background:#FFF3E2}
.pip.on{background:var(--sun)}
.pip .ico{width:32px;height:32px}
.pl{font:600 10.5px/1.15 var(--f-body);text-align:center;overflow-wrap:break-word}
.chilli .body{fill:#EEE7E1;transition:fill .25s}
.pip.lit .chilli .body{fill:#F0453A}

.actions{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-top:14px}
.next{font:800 16px/1 var(--f-display);color:#fff;background:var(--ink);border:none;border-radius:999px;padding:13px 24px 11px;
  box-shadow:0 4px 0 var(--coral);cursor:pointer;transition:transform .1s,box-shadow .1s,opacity .2s}
.next:active{transform:translateY(3px);box-shadow:0 1px 0 var(--coral)}
.next:disabled{opacity:.3;cursor:not-allowed}
.next.big{font-size:18px;padding:15px 28px 13px}
.next .arr{display:inline-block;margin-left:6px;animation:nudge 1.4s ease-in-out infinite}
.skip{font:600 14px var(--f-body);background:none;border:none;color:var(--muted);text-decoration:underline;text-underline-offset:3px;cursor:pointer;padding:8px 2px}
.foot{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:12px}
.back{font:600 13.5px var(--f-body);background:none;border:none;color:var(--muted);cursor:pointer;padding:4px 0}
.back:hover{color:var(--ink)}
.hint{font:600 12.5px/1.2 var(--f-body);color:var(--muted);text-align:right;margin-left:auto}

/* start + end */
.eyebrow{margin:0;font:700 11.5px/1.3 var(--f-body);letter-spacing:.12em;text-transform:uppercase;color:var(--coral-dk)}
.title{margin:4px 0 10px;font:800 36px/1 var(--f-display);text-wrap:balance}
.title span{color:var(--coral)}
.body{margin:0 0 8px;font:400 15.5px/1.5 var(--f-body);max-width:60ch}
.body.small{font-size:14px;color:var(--muted)}
.tags{list-style:none;display:flex;flex-wrap:wrap;gap:6px;padding:0;margin:10px 0 2px}
.tags li{font:600 12.5px/1.4 var(--f-body);border-radius:999px;padding:3px 11px 2px}
.tags li:nth-child(1){background:#FFE29A}.tags li:nth-child(2){background:#C9F0DD}.tags li:nth-child(3){background:#E2D7FF}
.fine{margin:12px 0 0;font:500 11.5px/1.4 var(--f-body);color:var(--muted)}
.status{margin:10px 0 4px;font:600 14px/1.4 var(--f-body);display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.status.ok{color:#22774B}
.status.err{color:#B3261E}
.mine{margin-top:10px;border-top:1.5px dashed #E4DCD3;padding-top:8px}
.mine summary{cursor:pointer;font:700 14px var(--f-body)}
.mine dl{margin:8px 0 0;display:grid;gap:6px}
.mine dt{font:600 12px/1.3 var(--f-body);color:var(--muted)}
.mine dd{margin:0;font:500 14px/1.35 var(--f-body);overflow-wrap:anywhere}

/* motion */
.bit{position:fixed;z-index:50;width:8px;height:8px;pointer-events:none;animation:bit .75s ease-out forwards}
.pop{transform-box:fill-box;transform-origin:50% 100%;animation:pop .6s cubic-bezier(.2,1.5,.4,1) both;animation-delay:var(--d,0s)}
.popin{transform-box:fill-box;transform-origin:center;animation:pp .5s cubic-bezier(.2,1.6,.4,1)}
.sticker{transform-box:fill-box;transform-origin:center;animation:wob 3s ease-in-out infinite alternate}
.bob{animation:bob 3.4s ease-in-out infinite alternate;animation-delay:var(--bd,0s)}
.swing{transform-box:view-box;animation:swing 3.6s ease-in-out infinite alternate}
.swing.s2{animation-delay:-1.6s}
.steam{transform-box:fill-box;transform-origin:50% 100%;animation:steam 2.6s ease-in-out infinite}
.steam.s2{animation-delay:1.3s}
.bulb{animation:tw 1.6s ease-in-out infinite alternate}
.tw{animation:tw 1.4s ease-in-out infinite alternate}
.draw{stroke-dasharray:150;stroke-dashoffset:150;animation:draw .9s .8s ease forwards}
.rise{transform-box:fill-box;animation:rise 2.4s ease-out both}
.dots circle{animation:tw .9s ease-in-out infinite alternate}
.dots circle:nth-child(2){animation-delay:.3s}
.dots circle:nth-child(3){animation-delay:.6s}
.buzz{transform-box:fill-box;transform-origin:center;animation:buzz .35s linear infinite}
.argue .say{transform-box:fill-box;transform-origin:50% 100%;animation:argue .45s ease-in-out infinite}
.argue.slow .say{animation-duration:1.1s}
.letter{transform-box:fill-box;animation:letter .9s .35s cubic-bezier(.2,1.2,.4,1) both}
[data-r="meterFill"]{transform-box:fill-box;transform-origin:50% 100%;transition:transform .7s cubic-bezier(.2,1.2,.3,1),fill .4s}
[data-r="bulb"]{transition:fill .4s}

@keyframes drift{from{transform:translate(0,0)}to{transform:translate(6vmax,5vmax)}}
@keyframes fall{from{transform:translate(0,0) rotate(0)}to{transform:translate(var(--dx,20px),110vh) rotate(720deg)}}
@keyframes artin{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes artout{to{opacity:0;transform:translateY(-10px)}}
@keyframes cin{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@keyframes cintop{from{opacity:0;transform:translateY(-14px)}to{opacity:1;transform:none}}
@keyframes cout{to{opacity:0;transform:translateY(-8px)}}
@keyframes sel{40%{transform:scale(1.04)}}
@keyframes nudge{50%{transform:translateX(4px)}}
@keyframes bit{from{transform:translate(-50%,-50%) rotate(0);opacity:1}to{transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) rotate(var(--rot));opacity:0}}
@keyframes pop{from{opacity:0;transform:translateY(18px) scale(.4)}to{opacity:1;transform:none}}
@keyframes pp{from{opacity:0;transform:scale(.2)}to{opacity:1;transform:none}}
@keyframes wob{from{transform:rotate(-4deg)}to{transform:rotate(4deg)}}
@keyframes bob{to{transform:translateY(-5px)}}
@keyframes swing{from{transform:rotate(-3deg)}to{transform:rotate(3deg)}}
@keyframes steam{0%{opacity:0;transform:translateY(6px)}45%{opacity:.55}100%{opacity:0;transform:translateY(-12px)}}
@keyframes tw{from{opacity:1}to{opacity:.35}}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes rise{from{transform:translateY(46px)}to{transform:none}}
@keyframes buzz{25%{transform:rotate(-2.5deg)}75%{transform:rotate(2.5deg)}}
@keyframes argue{50%{transform:rotate(-4deg) scale(1.04)}}
@keyframes jit{25%{transform:translate(-1px,1px)}75%{transform:translate(1px,-1px)}}
@keyframes letter{from{transform:translateY(70px)}to{transform:none}}
@keyframes flyl{to{transform:translate(-130%,-14px) rotate(-14deg);opacity:0}}
@keyframes flyr{to{transform:translate(130%,-14px) rotate(14deg);opacity:0}}
@keyframes flyu{to{transform:translateY(-70%) scale(.9);opacity:0}}
@keyframes deal{from{transform:translateY(10px) scale(.95);opacity:.4}to{transform:none;opacity:1}}

@media (max-height:660px){
  .q{font-size:19px;margin-bottom:10px}
  .opt{min-height:44px;padding:7px 11px;font-size:15px}
  .m-pic{width:64px;height:64px}
  .title{font-size:31px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
}
</style>
</head>
<body>

<div class="bgs" aria-hidden="true">
  <div class="bg" id="bgA"></div>
  <div class="bg" id="bgB"></div>
  <div class="fall" id="fall"></div>
</div>

<main class="app" id="app" data-mode="start">
  <header class="top">
    <div class="toprow"><span class="pc" id="pc"></span><span class="pt" id="pt"></span></div>
    <div class="segs" id="segs" aria-hidden="true"><i><b></b></i><i><b></b></i><i><b></b></i><i><b></b></i><i><b></b></i><i><b></b></i></div>
  </header>
  <div class="scene" id="scene"></div>
  <section class="card" id="card" aria-label="Survey question"></section>
</main>

<script>
(function () {
'use strict';

/* ================= settings =================
   Answers are saved to Supabase. The publishable key is safe to be public:
   the database only lets visitors add a response, never read one. */
const SUPABASE_URL = 'https://rihgdvyhaibolvznlcgx.supabase.co';
const SUPABASE_KEY = 'sb_publishable_7C1gKNK6UaeVfZ6FvdaFzg_ju9thZFE';
const LIVE = !!(SUPABASE_URL && SUPABASE_KEY);

/* ================= survey content ================= */
const DIFF = ['Very easy', 'Easy', 'Neutral', 'Difficult', 'Very difficult'];
const HAPPY = ['Very unhappy', 'Unhappy', 'Okay', 'Happy', 'Very happy'];
const UPCOMING = "It's coming up in the next few months";
const COUPLE = a => a.q1 === 'Bride' || a.q1 === 'Groom';

const CHAPTERS = [
  { title: 'About the wedding', bg: ['#FFE6D5', '#FFF6EE'], blobs: ['#FFC9A8', '#FFE29A', '#FFD1DC'], scene: sceneHome, react: reactHome },

/* ================= drawing helpers ================= */
const INK = '#2D2433';
const st = (w = 3) => `stroke="${INK}" stroke-width="${w}" stroke-linejoin="round" stroke-linecap="round"`;
const pop = (d, inner) => `<g class="pop" style="--d:${d}s">${inner}</g>`;
const at = (x, y, inner, rot) => `<g transform="translate(${x} ${y})${rot ? ` rotate(${rot})` : ''}">${inner}</g>`;
const art = inner => `<svg class="art" viewBox="0 0 360 260" preserveAspectRatio="xMidYMax meet" aria-hidden="true" focusable="false">${inner}</svg>`;
const f1 = n => (+n).toFixed(1);
function along(x1, y1, x2, y2, sag, n, fn) {
  let s = '';
  for (let k = 0; k <= n; k++) { const t = k / n; s += fn(x1 + (x2 - x1) * t, y1 + (y2 - y1) * t + sag * 4 * t * (1 - t), k); }
  return s;
}
function lights(x1, y1, x2, y2, sag, n, offEvery) {
  const cols = ['#FFD45C', '#FF9F7A', '#FF8FB1', '#9BE0C1'];
  let s = `<path d="M${x1} ${y1} Q${(x1 + x2) / 2} ${(y1 + y2) / 2 + sag * 2} ${x2} ${y2}" fill="none" stroke="${INK}" stroke-width="1.6" opacity=".7"/>`;
  s += along(x1, y1, x2, y2, sag, n, (x, y, k) => {
    if (k === 0 || k === n) return '';
    const off = offEvery && k % offEvery === 0, c = off ? '#CFC6D6' : cols[k % 4];
    return `<g class="${off ? '' : 'bulb'}" style="animation-delay:${(k % 5) * 0.35}s"><circle cx="${f1(x)}" cy="${f1(y + 5)}" r="3.8" fill="${c}" ${st(1.2)}/></g>`;
  });
  return s;
}
function kulhad(x, d) {
  return at(x, 250, pop(d,
    `<path class="steam" d="M-6 -52 q-6 -8 0 -16 q6 -8 0 -16" fill="none" stroke="${INK}" stroke-width="2.6" stroke-linecap="round" opacity=".45"/>
     <path class="steam s2" d="M6 -50 q-6 -8 0 -16 q6 -8 0 -16" fill="none" stroke="${INK}" stroke-width="2.6" stroke-linecap="round" opacity=".45"/>
     <path d="M-20 -44 L20 -44 L14 0 L-14 0 Z" fill="#D9825B" ${st()}/>
     <ellipse cx="0" cy="-44" rx="20" ry="5.5" fill="#F1D3A8" ${st()}/>
     <path d="M-16 -28 L16 -28" stroke="#A85A3A" stroke-width="2.5" stroke-linecap="round"/>`));
}
const sticker = (key, inner) => `<g data-r="${key}" display="none"><g class="sticker">${inner}</g></g>`;
const R = (root, key) => root.querySelector(`[data-r="${key}"]`);
function repop(el) { if (!el || reduce) return; el.classList.remove('popin'); void el.getBoundingClientRect(); el.classList.add('popin'); }
function toggle(root, key, on) {
  const el = R(root, key);
  if (!el) return;
  const was = el.getAttribute('display') !== 'none';
  if (on) { el.removeAttribute('display'); if (!was) repop(el); } else el.setAttribute('display', 'none');
}
function setText(root, key, txt) { const el = R(root, key); if (el && el.textContent !== txt) { el.textContent = txt; repop(el); } }

/* ---------- 1. about the wedding: calendar, chai, laddoos ---------- */
const lad = (x, y) => `<g transform="translate(${f1(x)} ${y})"><circle r="13" fill="#FFB547" ${st(2.5)}/><circle cx="-5" cy="-6" r="3" fill="#FFE0A0"/><circle cx="-3" cy="3" r="1.5" fill="#D9821A"/><circle cx="5" cy="-3" r="1.4" fill="#D9821A"/><circle cx="5" cy="6" r="1.5" fill="#D9821A"/></g>`;
function laddoos(n) {
  const rows = n === 3 ? 2 : n === 6 ? 3 : 4;
  let s = '';
  for (let r = 0; r < rows; r++) { const c = rows - r; for (let k = 0; k < c; k++) s += lad((k - (c - 1) / 2) * 26, -6 - r * 22); }
  return s;
}

  let sp = '';
  [[-58, -70], [56, -86], [-40, -118], [44, -40]].forEach(([x, y], k) => { sp += `<path class="tw" style="animation-delay:${k * 0.3}s" d="M${x} ${y - 7} L${x + 2} ${y - 2} L${x + 7} ${y} L${x + 2} ${y + 2} L${x} ${y + 7} L${x - 2} ${y + 2} L${x - 7} ${y} L${x - 2} ${y - 2} Z" fill="#FFC93C" stroke="${INK}" stroke-width="1.2"/>`; });

  const role = at(160, 90, sticker('role', `<circle r="28" fill="#FFD95A" ${st()}/><text class="tb" data-r="roleText" y="-3" text-anchor="middle" font-size="9" fill="${INK}" letter-spacing="1">I'M THE</text><text class="tb" data-r="roleText2" y="11" text-anchor="middle" font-size="12.5" fill="${INK}">BRIDE</text>`), 10);

  return art(cal + kulhad(196, 0.55) + plate + role + city);

function reactHome(root, a) {
  const roles = { 'Bride': 'BRIDE', 'Groom': 'GROOM', 'Parent of the bride or groom': 'PARENT', 'Sibling or other relative': 'SIBLING' };
  toggle(root, 'role', !!roles[a.q1]);
  if (roles[a.q1]) setText(root, 'roleText2', roles[a.q1]);
  const city = (a.q3a || '').trim();
  toggle(root, 'city', !!city);
  if (city) setText(root, 'cityText', city.length > 13 ? city.slice(0, 12) + '…' : city);
  const b = a.q3c;
  const n = b === 'Under ₹10 lakh' ? 3 : (b === '₹25 to 50 lakh' || b === 'Above ₹50 lakh') ? 10 : 6;
  const g = R(root, 'lad');
  if (g && +g.dataset.n !== n) { g.innerHTML = laddoos(n); g.dataset.n = n; repop(g); }
  toggle(root, 'spark', b === 'Above ₹50 lakh');
  toggle(root, 'cover', b === 'Prefer not to say');

}

function setProgress() {
  const c = Q[S.i].ch;

function swapCard(build, dir) {
  const h0 = card.hidden ? 0 : card.getBoundingClientRect().height;

function burst(e, el, n) {

  if ((!x && !y) && el) { const r = el.getBoundingClientRect(); x = r.left + r.width / 2; y = r.top + r.height / 2; }
  const cols = ['#FF7A59', '#FFD95A', '#9BE0C1', '#CDBDF5', '#A9DCF7'];

}

/* ================= questions ================= */
const visible = q => !q.show || q.show(S.answers);
function nextIdx(i) { for (let k = i + 1; k < Q.length; k++) if (visible(Q[k])) return k; return -1; }
function answered(spec) {
  const v = S.answers[spec.id];
  if (spec.type === 'multi') return Array.isArray(v) && v.length > 0;
  if (spec.type === 'text') return !!(v && String(v).trim());
  return v != null && v !== '';
}
const groupOk = q => q.parts.every(p => p.optional || answered(p));

function goQ(n, dir, keepSub) {
  busy = false;
  S.i = n;
  S.mode = 'q';
  app.dataset.mode = 'q';
  fallEl.classList.remove('on');
  const q = Q[n];
  if (q.type === 'rapid' && !keepSub) S.sub = dir < 0 ? q.rows.length - 1 : 0;
  setChapter(q.ch);
  setProgress();
  swapCard(() => buildQ(q), dir);
}
function advance() {
  const q = Q[S.i];
  S.hist.push(S.i);
  if (q.endOn && S.answers[q.id] === q.endOn) { screenOut(); return; }
  const n = nextIdx(S.i);
  if (n < 0) finish(); else goQ(n, 1);
}
function back() {
  if (busy) return;
  const q = Q[S.i];
  if (S.mode === 'q' && q && q.type === 'rapid' && S.sub > 0) {
    S.sub--;
    const box = card.querySelector('.rapid');
    if (box && box._update) box._update(true);
    return;
  }
  const p = S.hist.pop();
  if (p === undefined) { showStart(); return; }
  goQ(p, -1);
}

const HINT = { single: 'one tap', multi: 'pick all that apply', scale: 'drag or tap', rapid: 'one tap per card', group: 'answer each part', long: 'type, then Next', call: 'choose one' };

function buildQ(q) {
  const kicker = typeof q.kicker === 'function' ? q.kicker(S.answers) : q.kicker;
  const el = document.createElement('div');
  el.innerHTML = `

function actions(el, label, onNext, skipLabel, onSkip) {

function choices(spec, mount, layout, multi, labelId, onPick) {
  const chip = layout === 'chips';
  mount.classList.add(...(chip ? ['chips'] : ['answers', layout || 'list']));
  if (!multi) { mount.setAttribute('role', 'radiogroup'); mount.setAttribute('aria-labelledby', labelId); }
  const sel = new Set(multi ? (S.answers[spec.id] || []) : []);
  let other = null;
  const btns = [];
  const paint = () => btns.forEach((b, j) => {
    const o = spec.opts[j], on = multi ? sel.has(o) : S.answers[spec.id] === o;
    b.classList.toggle('sel', on);
    b.setAttribute(multi ? 'aria-pressed' : 'aria-checked', on ? 'true' : 'false');
  });
  spec.opts.forEach(o => {
    const b = document.createElement('button');
    b.type = 'button';
    b.className = (chip ? 'chip' : 'opt') + (multi ? ' multi' : '');
    if (!multi) b.setAttribute('role', 'radio');
    b.innerHTML = chip ? esc(o) : `<span class="mark" aria-hidden="true"></span><span>${esc(o)}</span>`;
    b.addEventListener('click', e => {
      if (busy) return;
      if (multi) {
        if (sel.has(o)) sel.delete(o);
        else {
          sel.add(o);
          if (spec.exclusive) {
            if (o === spec.exclusive) [...sel].forEach(x => { if (x !== o) sel.delete(x); });
            else sel.delete(spec.exclusive);

          burst(e, b);
        }
        S.answers[spec.id] = spec.opts.filter(x => sel.has(x));
        if (other) { other.hidden = !sel.has('Other'); if (o === 'Other' && sel.has('Other')) other.focus(); }
      } else {
        S.answers[spec.id] = o;
        burst(e, b);
      }
      paint();
      reactNow();
      if (onPick) onPick(e, b, o);
    });
    mount.appendChild(b);
    btns.push(b);
  });
  paint();
  if (spec.opts.includes('Other')) {
    other = document.createElement('input');
    other.className = 'field other';
    other.id = 'other-' + spec.id;
    other.placeholder = 'Other: tell us what (optional)';
    other.setAttribute('aria-label', 'Other, please describe');
    other.value = S.answers[spec.id + '_other'] || '';
    other.hidden = !sel.has('Other');
    other.addEventListener('input', () => { S.answers[spec.id + '_other'] = other.value.trim(); });
    mount.after(other);
  }
}

    box.querySelector('.d2').style.opacity = leftCards >= 1 ? '1' : '0';
    box.querySelector('.d3').style.opacity = leftCards >= 2 ? '1' : '0';
    front.className = 'dk d1';
    if (anim && !reduce) { void front.offsetWidth; front.classList.add('deal'); }
    light(vals[k]);
  };
  box._update = update;
  update(false);
  box.querySelectorAll('.pip').forEach(p => p.addEventListener('click', e => {
    if (busy) return;
    busy = true;
    const v = +p.dataset.v;
    vals[S.sub] = v;
    light(v);
    burst(e, p, 8);
    if (!reduce) front.classList.add(v <= 2 ? 'fly-l' : v >= 4 ? 'fly-r' : 'fly-u');
    setTimeout(() => {
      busy = false;
      if (S.sub < q.rows.length - 1) { S.sub++; update(true); } else advance();
    }, reduce ? 150 : 400);
  }));
}

function fillLong(q, box, el, isLast) {
  const f = document.createElement('textarea');
  f.className = 'field';
  f.id = 'f-' + q.id;
  f.placeholder = q.placeholder || '';
  f.setAttribute('aria-labelledby', 'qtext');
  f.value = S.answers[q.id] || '';
  box.appendChild(f);
  const ok = () => f.value.trim().length >= 3;
  const next = actions(el, isLast ? 'Finish' : 'Next →', () => { if (ok()) advance(); });
  const sync = () => { S.answers[q.id] = f.value.trim(); next.disabled = !ok(); };
  f.addEventListener('input', sync);
  sync();
}

function fillGroup(q, box, el, isLast) {
  box.className = 'answers parts';
  let next;
  const sync = () => {
    if (next) next.disabled = !groupOk(q);
    q.parts.forEach(p => { const w = box.querySelector(`[data-part="${p.id}"]`); if (w) w.classList.toggle('done', answered(p)); });
  };
  q.parts.forEach((p, k) => {
    const w = document.createElement('div');
    w.className = 'part';
    w.dataset.part = p.id;
    w.innerHTML = `<p class="plabel" id="pl-${p.id}">${esc(p.label)}${p.optional ? ' <small>(optional)</small>' : ''}${p.type === 'multi' ? ' <small>Pick all that apply.</small>' : ''}<span class="tick" aria-hidden="true">✓</span></p><div class="pbody"></div>`;
    box.appendChild(w);
    const body = w.querySelector('.pbody');
    const after = () => {
      sync();
      if (p.type === 'multi') return;
      const nxt = q.parts.slice(k + 1).find(x => !answered(x));
      if (!nxt) return;
      const t = box.querySelector(`[data-part="${nxt.id}"]`);
      setTimeout(() => {
        const top = t.getBoundingClientRect().top - card.getBoundingClientRect().top + card.scrollTop;
        if (top + 60 > card.scrollTop + card.clientHeight) card.scrollTo({ top: top - 14, behavior: reduce ? 'auto' : 'smooth' });
      }, 250);
    };
    if (p.type === 'single' || p.type === 'multi') choices(p, body, 'chips', p.type === 'multi', 'pl-' + p.id, after);
    else if (p.type === 'scale') meter(p, body, 'pl-' + p.id, after);
    else if (p.type === 'number') numSlider(p, body, 'pl-' + p.id, after);
    else if (p.type === 'text') {
      const f = document.createElement('input');
      f.className = 'field';
      f.id = 'f-' + p.id;
      f.placeholder = p.placeholder || '';
      f.setAttribute('aria-labelledby', 'pl-' + p.id);
      f.autocomplete = 'address-level2';
      f.value = S.answers[p.id] || '';
      f.addEventListener('input', () => { S.answers[p.id] = f.value.trim(); sync(); reactNow(); });
      body.appendChild(f);
    }
  });
  next = actions(el, isLast ? 'Finish' : 'Next →', () => { if (groupOk(q)) advance(); });
  sync();
}

function fillCall(q, box, el) {
  const pick = document.createElement('div');
  box.appendChild(pick);
  const form = document.createElement('div');
  form.innerHTML = `
    <label class="flabel" for="f-name">Your name</label><input class="field" id="f-name" autocomplete="name">
    <label class="flabel" for="f-contact">Phone number or email</label><input class="field" id="f-contact" autocomplete="off">`;
  box.appendChild(form);
  const n = form.querySelector('#f-name'), c = form.querySelector('#f-contact');
  n.value = S.answers.callName || '';
  c.value = S.answers.callContact || '';
  n.addEventListener('input', () => { S.answers.callName = n.value.trim(); });
  c.addEventListener('input', () => { S.answers.callContact = c.value.trim(); });
  const yes = () => /^Yes/.test(S.answers[q.id] || '');
  let next;
  const sync = () => {
    const show = yes();
    if (show && form.hidden) { form.hidden = false; form.classList.remove('reveal'); void form.offsetWidth; form.classList.add('reveal'); }
    form.hidden = !show;
    if (next) next.disabled = !answered(q);
  };
  choices(q, pick, 'grid', false, 'qtext', sync);
  next = actions(el, 'Finish', () => { if (answered(q)) advance(); });
  form.hidden = !yes();
  sync();
}

/* ================= endings ================= */
function payload() {
  const a = S.answers;
  const p = { 'Status': 'Completed', 'Minutes taken': +((Date.now() - S.t0) / 60000).toFixed(1) };
  const put = (spec, shown) => {
    let v = shown ? a[spec.id] : undefined;
    if (Array.isArray(v)) v = v.map(o => (o === 'Other' && a[spec.id + '_other'] ? `Other (${a[spec.id + '_other']})` : o)).join('; ');
    p[spec.key] = v == null ? '' : v;
  };
  Q.forEach(q => {
    const shown = visible(q);
    if (q.type === 'group') q.parts.forEach(pt => put(pt, shown));
    else if (q.type === 'rapid') q.rows.forEach((r, k) => { p[`Q23${'abcdefg'[k]} ${r} (1 very easy, 5 very difficult)`] = shown && a[q.id] && a[q.id][k] != null ? a[q.id][k] : ''; });
    else if (q.type === 'call') {
      put(q, shown);
      const yes = shown && /^Yes/.test(a[q.id] || '');
      p['Q25 Name'] = yes ? a.callName || '' : '';
      p['Q25 Phone or email'] = yes ? a.callContact || '' : '';
    } else put(q, shown);
  });
  return p;
}

async function submit() {
  if (!LIVE || sent || sending) return;
  sending = true;
  setStatus('sending');
  try {
    const p = payload();
    const res = await fetch(SUPABASE_URL + '/rest/v1/responses', {
      method: 'POST',
      headers: { 'apikey': SUPABASE_KEY, 'Content-Type': 'application/json', 'Prefer': 'return=minimal' },
      body: JSON.stringify({ status: p['Status'], minutes_taken: p['Minutes taken'], answers: p })
    });
    if (!res.ok) throw new Error('Save failed: ' + res.status);
    sent = true;
    setStatus('sent');
  } catch (err) {
    setStatus('error');
  } finally {
    sending = false;
  }
}
function setStatus(kind) {
  const el = $('#sendStatus');
  if (!el) return;
  el.className = 'status' + (kind === 'sent' ? ' ok' : kind === 'error' ? ' err' : '');
  if (kind === 'sending') el.textContent = 'Saving your answers…';
  if (kind === 'sent') el.textContent = 'Your answers are saved ✓';
  if (kind === 'preview') el.textContent = 'This is a preview copy, so your answers were not saved anywhere.';
  if (kind === 'error') {
    el.innerHTML = 'Your answers could not be saved. Check your internet connection and try again. <button class="next" type="button" id="retryBtn">Try again</button>';
    el.querySelector('#retryBtn').addEventListener('click', submit);
  }
}

function finish() {
  S.mode = 'end';
  app.dataset.mode = 'end';
  curCh = -2;
  setBg(END_BG);
  showScene(sceneThanks);
  fallEl.classList.add('on');
  swapCard(buildEnd, 1);
  setTimeout(() => burst(null, sceneEl, 24), 500);
}
function buildEnd() {
  const el = document.createElement('div');
  el.innerHTML = `
    <p class="eyebrow">All done</p>
    <h2 class="q" tabindex="-1">Thank you for sharing your story!</h2>
    <p class="body">Your answers will help us understand the real problems families face while planning a wedding.</p>
    <p class="status" id="sendStatus" role="status"></p>
    ${LIVE ? `<p class="body small">Know someone who got married recently, or is getting married soon? Please send this to them.</p>
      <div class="actions"><button class="next" id="copyBtn" type="button">Copy survey link</button></div>
      <input class="field" id="linkField" readonly hidden aria-label="Survey link">`
    : `<details class="mine"><summary>See my answers</summary><dl id="mine"></dl></details>
      <div class="actions"><button class="skip" id="againBtn" type="button">Start again</button></div>`}`;
  if (LIVE) {
    el.querySelector('#copyBtn').addEventListener('click', e => copyLink(e.currentTarget, el));
    setTimeout(submit, 0);
  } else {
    el.querySelector('#mine').innerHTML = Object.entries(payload()).filter(([k, v]) => v !== '' && k !== 'Status')
      .map(([k, v]) => `<div><dt>${esc(k)}</dt><dd>${esc(v)}</dd></div>`).join('');
    el.querySelector('#againBtn').addEventListener('click', showStart);
    setTimeout(() => setStatus('preview'), 0);
  }
  return el;
}
function copyLink(btn, el) {
  const url = location.href.split('#')[0];
  const done = () => { btn.textContent = 'Link copied ✓'; setTimeout(() => { btn.textContent = 'Copy survey link'; }, 1800); };
  const fallback = () => { const f = el.querySelector('#linkField'); f.value = url; f.hidden = false; f.select(); };
  try { navigator.clipboard.writeText(url).then(done, fallback); } catch (err) { fallback(); }
}
function screenOut() {
  S.mode = 'out';
  app.dataset.mode = 'out';
  swapCard(() => {
    const el = document.createElement('div');
    el.innerHTML = `
      <p class="kicker">No problem at all.</p>
      <h2 class="q" tabindex="-1">Thanks for stopping by!</h2>
      <p class="body">This survey is only about weddings from the last three years, or ones coming up in the next few months.</p>
      <p class="body small">Know someone who had a wedding recently? Please send this to them.</p>
      <div class="actions">${LIVE ? '<button class="next" id="copyBtn" type="button">Copy survey link</button>' : ''}<button class="skip" id="oops" type="button">I picked the wrong option</button></div>
      <input class="field" id="linkField" readonly hidden aria-label="Survey link">`;
    el.querySelector('#oops').addEventListener('click', back);
    if (LIVE) el.querySelector('#copyBtn').addEventListener('click', e => copyLink(e.currentTarget, el));
    return el;
  }, 1);
}

/* number keys pick an answer on one-tap screens */
document.addEventListener('keydown', e => {
  if (S.mode !== 'q' || e.metaKey || e.ctrlKey || e.altKey || (e.target && e.target.matches && e.target.matches('input,textarea,[role="slider"]'))) return;
  const q = Q[S.i];
  if (!q || !['single', 'rapid'].includes(q.type)) return;
  const n = parseInt(e.key, 10);
  if (!(n >= 1 && n <= 9)) return;
  const btns = card.querySelectorAll('.cin:not(.out) .opt, .cin:not(.out) .pip');
  if (btns[n - 1]) { e.preventDefault(); btns[n - 1].click(); }
});

/* ================= boot ================= */
const hot = window.claude && window.claude.hot;
if (hot && hot.snapshot) { try { hot.snapshot(() => ({ S: JSON.parse(JSON.stringify(S)) })); } catch (err) { /* optional */ } }
function boot(data) {
  const s = data && data.S;
  if (s && s.mode === 'q' && Number.isInteger(s.i) && s.i >= 0 && s.i < Q.length) { S = s; goQ(S.i, 1, true); return; }
  showStart();
}
if (hot && hot.ready) hot.ready(boot); else boot((hot && hot.data) || {});
})();
</script>
